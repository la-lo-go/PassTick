name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :android:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew :android:lintDebug

      - name: Check complexity
        run: ./gradlew :android:detektComplexity

      - name: Assemble release
        run: ./gradlew :android:assembleRelease

      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            android/build/reports/tests/
            android/build/reports/lint-results-debug.html
            android/build/reports/detekt/
          retention-days: 7
