name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        run: ./gradlew :android:testDebugUnitTest

      - name: Run Android lint
        run: ./gradlew :android:lintDebug

      - name: Check complexity
        run: ./gradlew :android:detektComplexity

      - name: Assemble release
        run: ./gradlew :android:assembleRelease

      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            android/build/reports/tests/
            android/build/reports/lint-results-debug.html
            android/build/reports/detekt/
          retention-days: 7

  instrumented:
    name: Instrumented tests (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # SDK 37 uses the minor-versioned package name system-images;android-37.0.
        api-level: [29, 37.0]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          script: ./gradlew :android:connectedDebugAndroidTest

      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-reports-api-${{ matrix.api-level }}
          path: android/build/reports/androidTests/
          retention-days: 7
