AutoName: PassTick
Summary: Offline wallet for pkpass and esPass files

Description: |-
  PassTick is an offline wallet for Apple Wallet (.pkpass) and esPass (.esPass)
  files. It shows the barcode at the point of use.

  Import a pass from a file, an email attachment, or the Android share sheet.
  PassTick stores the pass in app-private storage. The app has no INTERNET
  permission, no account, no ads, and no trackers.

  Features:
  * Shows QR, Aztec, PDF417, Code 128, and other barcodes.
  * Reminds you before an event and puts access actions in the notification.
  * Adds pass dates to the calendar.
  * Groups today's passes on the home screen and in a timeline.
  * Opens pass locations in a map app.
  * Organizes passes with tags, pins, archive, and trash with undo.
  * Protects passes with fingerprint or screen lock and can block screenshots.
  * Keeps protected content out of widgets and the lock screen.
  * Exports and shares a pass image or the pass file.

